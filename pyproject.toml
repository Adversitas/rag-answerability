[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ragabstain"
version = "0.1.0"
description = "Answer or abstain: hallucination control for RAG on SQuAD 2.0. Hybrid retrieval, an extractive SQuAD2 reader, a learned answerability gate tuned on a calibration split, selective-QA metrics, and a comparison with a local LLM reader."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scikit-learn>=1.3"]

[project.optional-dependencies]
models = ["torch>=2.2", "transformers>=4.45", "sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
ragabstain = "ragabstain.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ragabstain"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
