name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # models extra not needed: reader and LLM are replaced by deterministic fakes in tests
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: BM25 passage retrieval on the committed SQuAD 2.0 sample (no model download)
        run: ragabstain --reports ci-reports retrieval --retrievers bm25
      - run: ragabstain report
